[project]
name = "servidor-mcp"
version = "0.1.0"
description = "Servidor MCP da Hill Valley Tech (A Ponte)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "controllers", "views"]
