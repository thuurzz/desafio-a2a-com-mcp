[project]
name = "agente"
version = "0.1.0"
description = "Agente A Ponte — host MCP por dentro (fase 3)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agente", "agente.models", "agente.controllers", "agente.views"]
